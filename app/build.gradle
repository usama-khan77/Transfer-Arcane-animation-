plugins {
    id 'com.android.application'
}

android {
    namespace 'com.usama.aianimationstudio'
    compileSdk 35

    defaultConfig {
        applicationId 'com.usama.aianimationstudio'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildFeatures {
        buildConfig true
    }
}
